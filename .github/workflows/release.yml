name: Release

on:
  push:
    tags: ["v*"]
  # Manual release from main: tags the current commit as v<pyproject version>.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine the release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "manual releases run from main only"; exit 1; }
            version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            echo "TAG=v$version" >> "$GITHUB_ENV"
          fi
      - name: Check tag matches pyproject version and build the skill ZIP
        run: python tools/build_skill_zip.py --check-tag "$TAG"
      - name: Create GitHub release with the ZIP attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --verify-tag
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
