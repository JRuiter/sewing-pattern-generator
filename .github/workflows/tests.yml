name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push to the same PR cancels the run that is still going.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check scripts tests tools --output-format github
      - name: Mypy
        run: mypy

  # Full suite with coverage on the main Python version, spread over the runner's cores.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install poppler (A4 overlap test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: python -m pytest tests -q -n auto --cov=scripts --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

  # Oldest supported Python: the quick tests are enough to catch syntax and library differences;
  # the slow ones only render more of the same code.
  pytest-oldest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run quick tests
        run: python -m pytest tests -q -n auto -m "not slow"
